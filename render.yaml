services:
  - type: web
    name: narkadhai-backend
    env: python
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GMAIL_USER
        value: support.narkadhai@gmail.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: EMAIL_FROM
        value: Narkadhai <support.narkadhai@gmail.com>
      - key: EMAIL_REPLY_TO
        value: support.narkadhai@gmail.com
      - key: OWNER_EMAIL
        value: support.narkadhai@gmail.com
      - key: FRONTEND_URL
        value: https://narkadhai.vercel.app,http://localhost:5173
